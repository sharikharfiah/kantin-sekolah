 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Lucu Pre-Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE REALTIME DATABASE SDK (LEBIH STABIL & REALTIME) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Quicksand', sans-serif; }
        h1, h2, h3, .font-cute { font-family: 'Fredoka', cursive; }
    </style>
</head>
<body class="bg-pink-50 text-slate-700 min-h-screen flex flex-col selection:bg-pink-200">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-white/95 backdrop-blur-md border-2 border-pink-300 text-slate-800 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transition-all duration-300">
        <span id="toast-icon" class="text-xl">✨</span>
        <span id="toast-msg" class="text-xs font-bold"></span>
    </div>

    <!-- HALAMAN LOGIN / AUTH -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-pink-200 via-purple-100 to-amber-100">
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 max-w-md w-full border-4 border-white">
            <div class="text-center mb-8">
                <div class="inline-block bg-pink-100 text-pink-500 p-3 rounded-full mb-3 text-3xl shadow-inner">🍱</div>
                <h1 class="text-3xl font-bold text-pink-500 tracking-wide font-cute">Pre-Order Kantin</h1>
                <p class="text-slate-400 text-xs font-semibold mt-1">Jajan lucu tanpa perlu antre di kantin!</p>
            </div>

            <!-- Tab Switch Role -->
            <div class="flex bg-pink-50 p-1.5 rounded-2xl mb-6 border border-pink-100">
                <button type="button" id="tab-siswa-btn" class="w-1/2 py-2.5 rounded-xl text-xs font-bold text-center bg-white text-pink-500 shadow-md transition-all font-cute cursor-pointer">
                    💖 Siswa
                </button>
                <button type="button" id="tab-penjual-btn" class="w-1/2 py-2.5 rounded-xl text-xs font-bold text-center text-slate-400 hover:text-slate-600 transition-all font-cute cursor-pointer">
                    👩‍🍳 Penjual
                </button>
            </div>

            <!-- Form Siswa -->
            <div id="form-siswa" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Lengkap</label>
                    <input type="text" id="login-nama-siswa" placeholder="Ketik nama kamu di sini..." class="w-full px-4 py-3 rounded-2xl border-2 border-pink-100 focus:border-pink-400 outline-none text-xs bg-white/80 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Kelas</label>
                    <select id="login-kelas-siswa" class="w-full px-4 py-3 rounded-2xl border-2 border-pink-100 focus:border-pink-400 outline-none text-xs bg-white/80 transition">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="XA">XA</option>
                        <option value="XB">XB</option>
                        <option value="XC">XC</option>
                        <option value="XD">XD</option>
                        <option value="XE">XE</option>
                        <option value="XF">XF</option>
                        <option value="XG">XG</option>
                        <option value="XI NAKES">XI NAKES</option>
                        <option value="XI MANAJERIAL">XI MANAJERIAL</option>
                        <option value="XI AI IOT">XI AI IOT</option>
                        <option value="XI INKREA">XI INKREA</option>
                        <option value="XI SOSHUM">XI SOSHUM</option>
                        <option value="XI TERAPAN">XI TERAPAN</option>
                        <option value="XII NAKES">XII NAKES</option>
                        <option value="XII MANAJERIAL">XII MANAJERIAL</option>
                        <option value="XII AI IOT">XII AI IOT</option>
                        <option value="XII INKREA">XII INKREA</option>
                        <option value="XII DIKMU">XII DIKMU</option>
                        <option value="XII SOSHUM">XII SOSHUM</option>
                        <option value="XII TERAPAN">XII TERAPAN</option>
                    </select>
                </div>
                <button type="button" id="btn-login-siswa" class="w-full bg-pink-400 hover:bg-pink-500 text-white py-3.5 rounded-2xl font-bold text-sm tracking-wide transition shadow-lg shadow-pink-300/50 active:scale-95 font-cute cursor-pointer">
                    Masuk Ke Menu Jajanan
                </button>
            </div>

            <!-- Form Penjual -->
            <div id="form-penjual" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">PIN Penjual</label>
                    <input type="password" id="login-pin-penjual" placeholder="PIN Rahasia: 0622" class="w-full px-4 py-3 rounded-2xl border-2 border-pink-100 focus:border-pink-400 outline-none text-xs bg-white/80 transition">
                </div>
                <button type="button" id="btn-login-penjual" class="w-full bg-purple-400 hover:bg-purple-500 text-white py-3.5 rounded-2xl font-bold text-sm tracking-wide transition shadow-lg shadow-purple-300/50 active:scale-95 font-cute cursor-pointer">
                    Buka Dashboard Penjual
                </button>
            </div>
        </div>
    </div>

    <!-- APP CONTAINER MAIN -->
    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <!-- NAVBAR -->
        <nav class="bg-white/80 backdrop-blur-md border-b-2 border-pink-100 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl">🍰</span>
                    <div>
                        <h1 class="font-bold text-pink-500 text-lg leading-tight font-cute">Kantin Sekolah</h1>
                        <span id="user-badge" class="text-[11px] font-bold text-purple-400 bg-purple-50 px-2 py-0.5 rounded-full"></span>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <div id="siswa-nav" class="flex items-center space-x-2">
                        <button type="button" id="btn-view-menu" class="px-4 py-2 rounded-2xl text-xs font-bold bg-pink-400 text-white shadow-sm transition font-cute cursor-pointer">🍔 Menu</button>
                        <button type="button" id="btn-view-orders" class="px-4 py-2 rounded-2xl text-xs font-bold text-slate-500 hover:bg-pink-50 relative transition font-cute cursor-pointer">
                            📋 Pesanan
                            <span id="my-orders-count" class="hidden absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                        </button>
                        <button type="button" id="btn-cart-toggle" class="px-4 py-2 rounded-2xl text-xs font-bold bg-amber-100 text-amber-700 hover:bg-amber-200 relative transition font-cute cursor-pointer">
                            🛒 Keranjang
                            <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                        </button>
                    </div>
                    <button type="button" id="btn-logout" class="px-3 py-2 rounded-2xl text-xs font-bold text-slate-400 hover:text-red-500 hover:bg-red-50 transition cursor-pointer">Keluar</button>
                </div>
            </div>
        </nav>

        <!-- DASHBOARD SISWA -->
        <main id="siswa-dashboard" class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">
            <div id="view-menu" class="space-y-6">
                <div class="flex items-center justify-between flex-wrap gap-3 bg-white p-3.5 rounded-3xl border-2 border-pink-100 shadow-sm">
                    <div class="flex items-center space-x-2">
                        <button type="button" data-cat="all" class="cat-btn bg-pink-400 text-white px-4 py-2 rounded-2xl text-xs font-bold transition shadow-sm font-cute cursor-pointer">✨ Semua</button>
                        <button type="button" data-cat="makanan" class="cat-btn bg-pink-50 text-pink-500 hover:bg-pink-100 px-4 py-2 rounded-2xl text-xs font-bold transition font-cute cursor-pointer">🍔 Makanan</button>
                        <button type="button" data-cat="minuman" class="cat-btn bg-pink-50 text-pink-500 hover:bg-pink-100 px-4 py-2 rounded-2xl text-xs font-bold transition font-cute cursor-pointer">🧃 Minuman</button>
                    </div>
                    <div class="w-full sm:w-64">
                        <input type="text" id="search-input" placeholder="Cari makanan & minuman..." class="w-full px-4 py-2 bg-pink-50/50 rounded-2xl border border-pink-100 text-xs focus:outline-none focus:ring-2 focus:ring-pink-300 transition">
                    </div>
                </div>
                <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>

            <div id="view-orders" class="hidden space-y-4 max-w-2xl mx-auto">
                <h2 class="text-xl font-bold text-pink-500 font-cute">Riwayat Pesanan Kamu</h2>
                <div id="my-orders-list" class="space-y-3"></div>
            </div>
        </main>

        <!-- DASHBOARD PENJUAL -->
        <main id="penjual-dashboard" class="hidden flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-3xl border-2 border-pink-100 shadow-sm">
                    <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Total Masuk</p>
                    <p id="stat-total" class="text-3xl font-bold text-pink-500 mt-1 font-cute">0</p>
                </div>
                <div class="bg-white p-5 rounded-3xl border-2 border-pink-100 shadow-sm">
                    <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Perlu Diproses</p>
                    <p id="stat-pending" class="text-3xl font-bold text-amber-500 mt-1 font-cute">0</p>
                </div>
                <div class="bg-white p-5 rounded-3xl border-2 border-pink-100 shadow-sm">
                    <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Total Omset</p>
                    <p id="stat-income" class="text-3xl font-bold text-emerald-500 mt-1 font-cute">Rp 0</p>
                </div>
            </div>

            <div class="bg-white rounded-3xl border-2 border-pink-100 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-pink-100 flex justify-between items-center bg-pink-50/50">
                    <h2 class="font-bold text-pink-500 text-sm font-cute">📥 Daftar Pesanan Masuk (Real-Time Cloud)</h2>
                    <span class="text-[11px] bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full font-bold">● Auto Update Active</span>
                </div>
                <div id="penjual-orders-list" class="divide-y divide-pink-50"></div>
            </div>
        </main>
    </div>

    <!-- CART DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden transition-opacity">
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col border-l-4 border-pink-200">
            <div class="p-4 border-b border-pink-100 flex justify-between items-center bg-pink-50">
                <h2 class="font-bold text-pink-500 font-cute">🛒 Keranjang Belanja</h2>
                <button type="button" id="btn-cart-close" class="text-slate-400 hover:text-slate-600 font-bold text-xs bg-white px-2.5 py-1 rounded-xl cursor-pointer">Tutup</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4 divide-y divide-pink-50"></div>
            <div id="cart-footer" class="p-4 border-t border-pink-100 bg-pink-50/50 space-y-4">
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Jam Istirahat Pengambilan</label>
                        <select id="checkout-jam" class="w-full p-2.5 border border-pink-200 rounded-2xl text-xs bg-white outline-none focus:ring-2 focus:ring-pink-300">
                            <option value="Istirahat Pertama (09.15 - 09.30)">Istirahat Pertama (09.15 - 09.30)</option>
                            <option value="Istirahat Kedua (11.45 - 12.30)">Istirahat Kedua (11.45 - 12.30)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Metode Pembayaran</label>
                        <select id="checkout-bayar" class="w-full p-2.5 border border-pink-200 rounded-2xl text-xs bg-white outline-none focus:ring-2 focus:ring-pink-300">
                            <option value="Tunai saat Ambil">Tunai (Bayar di Kantin)</option>
                            <option value="QRIS">QRIS / Non-Tunai</option>
                        </select>
                    </div>
                </div>
                <div class="border-t border-pink-200 pt-3 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Pesanan</span>
                    <span id="cart-total" class="text-xl font-bold text-pink-500 font-cute">Rp 0</span>
                </div>
                <button type="button" id="btn-submit-order" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-pink-300/50 transition text-xs uppercase tracking-wider active:scale-95 font-cute cursor-pointer">
                    Kirim Pre-Order Sekarang 🚀
                </button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE DATABASE DEMO CONFIG (STABIL & SAFE FALLBACK)
        const firebaseConfig = {
            databaseURL: "https://kantin-sekolah-demo-default-rtdb.firebaseio.com"
        };
        
        let db = null;
        try {
            if (window.firebase) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch(e) {}

        const foodLogoSVG = `<svg class="w-5 h-5 text-amber-500 inline" fill="currentColor" viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.35L5 22h2.1l1.1-7h1.6l1.1 7H13l-1.45-8.65C13.54 12.9 15 11.12 15 9V2h-2v7h-2zm9-7h-2c-1.66 0-3 1.34-3 3v8h2v9h3V2z"/></svg>`;
        const drinkLogoSVG = `<svg class="w-5 h-5 text-cyan-500 inline" fill="currentColor" viewBox="0 0 24 24"><path d="M5 19c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8H5v11zm3.5-6h7v2h-7v-2zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

        const initialMenu = [
            { id: 'm1', nama: 'Mie', kategori: 'makanan', harga: 7000, deskripsi: 'Indomie Goreng / Kuah / Mie Pedas. Tulis varian & level pedas di catatan.' },
            { id: 'm2', nama: 'Bubur Instan', kategori: 'makanan', harga: 7000, deskripsi: 'Bubur instan hangat. Tulis varian rasa di catatan.' },
            { id: 'm3', nama: 'Nasi Porsi', kategori: 'makanan', harga: 7000, deskripsi: 'Pilihan topping (Kornet / Nugget / Sosis) wajib ditulis di catatan.' },
            { id: 'm4', nama: 'Cireng (Isi Keju / Ayam Suwir)', kategori: 'makanan', harga: 5000, deskripsi: 'Tulis pilihan isi (Keju / Ayam Suwir) di catatan.' },
            { id: 'm5', nama: 'Cipuk (Aci Kerupuk)', kategori: 'makanan', harga: 1000, deskripsi: 'Harga per pcs. Renyah dan gurih.' },
            { id: 'm6', nama: 'Cipuk Kuah (Aci Kerupuk)', kategori: 'makanan', harga: 5000, deskripsi: 'Aci kerupuk kuah pedas gurih segar.' },
            { id: 'm7', nama: 'Sotong', kategori: 'makanan', harga: 500, deskripsi: 'Harga per pcs. Camilan gurih hangat.' },
            { id: 'm8', nama: 'Kentang Goreng (1 Porsi)', kategori: 'makanan', harga: 5000, deskripsi: 'Kentang renyah dengan bumbu tabur.' },
            { id: 'm9', nama: 'Piscok (Isi 3)', kategori: 'makanan', harga: 5000, deskripsi: 'Pisang cokelat lumer isi 3 pcs.' },
            { id: 'm10', nama: 'Tempe Goreng (Isi 3)', kategori: 'makanan', harga: 5000, deskripsi: 'Tempe goreng tepung renyah isi 3 pcs.' },
            { id: 'm11', nama: 'Aneka Snack', kategori: 'makanan', harga: 2500, deskripsi: 'Sari Gandum, Good Time, Slai Olai, Ritz, Ovaltine, Nextar, dll.' },
            { id: 'm12', nama: 'Minuman Es', kategori: 'minuman', harga: 5000, deskripsi: 'Varian rasa, es, atau gula diisi di catatan item.' },
            { id: 'm13', nama: 'Susu Ultra Milk', kategori: 'minuman', harga: 6000, deskripsi: 'Pilihan rasa: Coklat, Strawberry, Matcha, Butterscotch, Taro, Full Cream.' },
            { id: 'm14', nama: 'Susu Cimory', kategori: 'minuman', harga: 7000, deskripsi: 'Pilihan rasa: Matcha, Blueberry, Marie Biskuit, Milk Tea, Lactose Free.' },
            { id: 'm15', nama: 'Susu Nobo (Oat Milk)', kategori: 'minuman', harga: 4000, deskripsi: 'Susu oat (oat milk) sehat & segar.' },
            { id: 'm16', nama: 'Susu Oatside', kategori: 'minuman', harga: 8000, deskripsi: 'Pilihan rasa: Barista Blend, Coklat, Chocolate Malt.' },
            { id: 'm17', nama: 'Mizone', kategori: 'minuman', harga: 6000, deskripsi: 'Minuman isotonik bernutrisi penyegar.' }
        ];

        let currentUser = null; 
        let cart = JSON.parse(localStorage.getItem('kantin_cart')) || [];
        let orders = JSON.parse(localStorage.getItem('kantin_orders')) || [];
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            // Mencegah Error Event Handlers
            document.getElementById('tab-siswa-btn').onclick = () => switchAuthTab('siswa');
            document.getElementById('tab-penjual-btn').onclick = () => switchAuthTab('penjual');
            document.getElementById('btn-login-siswa').onclick = loginSiswa;
            document.getElementById('btn-login-penjual').onclick = loginPenjual;
            document.getElementById('btn-logout').onclick = logout;
            document.getElementById('btn-view-menu').onclick = () => switchSiswaView('menu');
            document.getElementById('btn-view-orders').onclick = () => switchSiswaView('orders');
            document.getElementById('btn-cart-toggle').onclick = toggleCartDrawer;
            document.getElementById('btn-cart-close').onclick = toggleCartDrawer;
            document.getElementById('btn-submit-order').onclick = submitOrder;
            document.getElementById('search-input').onkeyup = searchMenu;

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.onclick = (e) => {
                    currentCategory = e.currentTarget.getAttribute('data-cat');
                    document.querySelectorAll('.cat-btn').forEach(b => b.className = "cat-btn bg-pink-50 text-pink-500 hover:bg-pink-100 px-4 py-2 rounded-2xl text-xs font-bold transition font-cute cursor-pointer");
                    e.currentTarget.className = "cat-btn bg-pink-400 text-white px-4 py-2 rounded-2xl text-xs font-bold transition shadow-sm font-cute cursor-pointer";
                    renderMenu();
                };
            });

            // REALTIME FIREBASE LISTEN ON VALUE
            if (db) {
                try {
                    db.ref('orders').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            orders = Object.values(data).reverse();
                            localStorage.setItem('kantin_orders', JSON.stringify(orders));
                            refreshCurrentDashboardView();
                        }
                    });
                } catch(e) {}
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'kantin_orders') {
                    orders = JSON.parse(e.newValue) || [];
                    refreshCurrentDashboardView();
                }
            });
        });

        function refreshCurrentDashboardView() {
            if (currentUser && currentUser.role === 'penjual') renderPenjualOrders();
            else if (currentUser && currentUser.role === 'siswa') renderMyOrders();
        }

        function switchAuthTab(role) {
            const btnSiswa = document.getElementById('tab-siswa-btn');
            const btnPenjual = document.getElementById('tab-penjual-btn');
            if (role === 'siswa') {
                btnSiswa.className = "w-1/2 py-2.5 rounded-xl text-xs font-bold text-center bg-white text-pink-500 shadow-md transition-all font-cute cursor-pointer";
                btnPenjual.className = "w-1/2 py-2.5 rounded-xl text-xs font-bold text-center text-slate-400 hover:text-slate-600 transition-all font-cute cursor-pointer";
                document.getElementById('form-siswa').classList.remove('hidden');
                document.getElementById('form-penjual').classList.add('hidden');
            } else {
                btnPenjual.className = "w-1/2 py-2.5 rounded-xl text-xs font-bold text-center bg-white text-purple-500 shadow-md transition-all font-cute cursor-pointer";
                btnSiswa.className = "w-1/2 py-2.5 rounded-xl text-xs font-bold text-center text-slate-400 hover:text-slate-600 transition-all font-cute cursor-pointer";
                document.getElementById('form-penjual').classList.remove('hidden');
                document.getElementById('form-siswa').classList.add('hidden');
            }
        }

        function loginSiswa() {
            const nama = document.getElementById('login-nama-siswa').value.trim();
            const kelas = document.getElementById('login-kelas-siswa').value;
            if (!nama || !kelas) { showToast("Isi nama dan pilih kelas dulu ya!", "error"); return; }
            currentUser = { role: 'siswa', nama: nama, kelas: kelas };
            showMainApp();
            showToast(`Halo ${nama}, selamat berbelanja! ✨`);
        }

        function loginPenjual() {
            const pin = document.getElementById('login-pin-penjual').value.trim();
            if (pin === '0622') {
                currentUser = { role: 'penjual', nama: 'Penjual Kantin' };
                showMainApp();
                showToast("Berhasil masuk ke Dashboard Penjual");
            } else {
                showToast("PIN Salah! Masukkan PIN 0622", "error");
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('login-nama-siswa').value = '';
            document.getElementById('login-pin-penjual').value = '';
            showToast("Kamu berhasil keluar");
        }

        function showMainApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');

            if (currentUser.role === 'siswa') {
                document.getElementById('user-badge').innerText = `Siswa: ${currentUser.nama} (${currentUser.kelas})`;
                document.getElementById('siswa-nav').classList.remove('hidden');
                document.getElementById('siswa-dashboard').classList.remove('hidden');
                document.getElementById('penjual-dashboard').classList.add('hidden');
                renderMenu();
                updateCartUI();
                renderMyOrders();
            } else {
                document.getElementById('user-badge').innerText = `Mode Penjual Kantin`;
                document.getElementById('siswa-nav').classList.add('hidden');
                document.getElementById('siswa-dashboard').classList.add('hidden');
                document.getElementById('penjual-dashboard').classList.remove('hidden');
                renderPenjualOrders();
            }
        }

        function switchSiswaView(view) {
            if (view === 'menu') {
                document.getElementById('view-menu').classList.remove('hidden');
                document.getElementById('view-orders').classList.add('hidden');
                document.getElementById('btn-view-menu').className = "px-4 py-2 rounded-2xl text-xs font-bold bg-pink-400 text-white shadow-sm transition font-cute cursor-pointer";
                document.getElementById('btn-view-orders').className = "px-4 py-2 rounded-2xl text-xs font-bold text-slate-500 hover:bg-pink-50 relative transition font-cute cursor-pointer";
            } else {
                document.getElementById('view-menu').classList.add('hidden');
                document.getElementById('view-orders').classList.remove('hidden');
                document.getElementById('btn-view-orders').className = "px-4 py-2 rounded-2xl text-xs font-bold bg-pink-400 text-white relative transition shadow-sm font-cute cursor-pointer";
                document.getElementById('btn-view-menu').className = "px-4 py-2 rounded-2xl text-xs font-bold text-slate-500 hover:bg-pink-50 transition font-cute cursor-pointer";
                renderMyOrders();
            }
        }

        function searchMenu() { renderMenu(); }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const query = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = initialMenu.filter(item => {
                const matchCat = currentCategory === 'all' || item.kategori === currentCategory;
                const matchQuery = item.nama.toLowerCase().includes(query) || item.deskripsi.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs font-bold">Yah, menu tidak ditemukan 🥺</div>`;
                return;
            }

            filtered.forEach(item => {
                const logo = item.kategori === 'makanan' ? foodLogoSVG : drinkLogoSVG;
                const badgeBg = item.kategori === 'makanan' ? 'bg-amber-50 border-amber-100' : 'bg-cyan-50 border-cyan-100';
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl border-2 border-pink-100/80 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div class="p-4 space-y-2">
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex items-center space-x-1.5">
                                <span class="p-1 rounded-xl ${badgeBg} border">${logo}</span>
                                <h3 class="font-bold text-slate-800 text-xs leading-snug font-cute">${item.nama}</h3>
                            </div>
                            <span class="text-[11px] font-bold text-pink-500 bg-pink-50 px-2.5 py-0.5 rounded-full shrink-0 font-cute">Rp ${item.harga.toLocaleString('id-ID')}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 leading-relaxed font-medium">${item.deskripsi}</p>
                    </div>
                    <div class="p-3 bg-pink-50/40 border-t border-pink-50">
                        <button type="button" class="btn-add-cart w-full bg-pink-400 hover:bg-pink-500 text-white text-xs font-bold py-2.5 rounded-2xl transition active:scale-95 font-cute cursor-pointer" data-id="${item.id}">
                            + Tambah Ke Keranjang
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.btn-add-cart').forEach(b => {
                b.onclick = (e) => addToCart(e.currentTarget.getAttribute('data-id'));
            });
        }

        function toggleCartDrawer() { document.getElementById('cart-drawer').classList.toggle('hidden'); }

        function addToCart(menuId) {
            const itemMenu = initialMenu.find(m => m.id === menuId);
            cart.push({ cartId: Date.now().toString(), menuId: itemMenu.id, nama: itemMenu.nama, harga: itemMenu.harga, qty: 1, notes: '' });
            saveCart();
            updateCartUI();
            showToast(`${itemMenu.nama} berhasil dimasukkan! 🎉`);
        }

        function saveCart() { localStorage.setItem('kantin_cart', JSON.stringify(cart)); }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalElem = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

            if (totalItems > 0) { badge.innerText = totalItems; badge.classList.remove('hidden'); }
            else badge.classList.add('hidden');

            totalElem.innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 space-y-1"><p class="text-xs font-bold text-slate-500 font-cute">Keranjang Masih Kosong 🛍️</p></div>`;
                return;
            }

            container.innerHTML = '';
            cart.forEach(item => {
                const el = document.createElement('div');
                el.className = "pt-3 first:pt-0 space-y-2";
                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-slate-800 text-xs font-cute">${item.nama}</h4>
                            <p class="text-xs text-pink-500 font-bold mt-0.5">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2 bg-pink-50 rounded-2xl p-1 border border-pink-100">
                            <button type="button" class="btn-qty-minus w-6 h-6 bg-white rounded-xl text-xs font-bold text-pink-500 shadow-sm hover:bg-pink-100 cursor-pointer" data-id="${item.cartId}">-</button>
                            <span class="text-xs font-bold px-1">${item.qty}</span>
                            <button type="button" class="btn-qty-plus w-6 h-6 bg-white rounded-xl text-xs font-bold text-pink-500 shadow-sm hover:bg-pink-100 cursor-pointer" data-id="${item.cartId}">+</button>
                        </div>
                    </div>
                    <input type="text" class="input-notes w-full text-xs p-2.5 bg-amber-50/80 border border-amber-200 rounded-2xl text-slate-700" data-id="${item.cartId}" value="${item.notes}" placeholder="Catatan (Topping/Varian...)">
                `;
                container.appendChild(el);
            });

            document.querySelectorAll('.btn-qty-minus').forEach(b => b.onclick = (e) => updateQty(e.currentTarget.getAttribute('data-id'), -1));
            document.querySelectorAll('.btn-qty-plus').forEach(b => b.onclick = (e) => updateQty(e.currentTarget.getAttribute('data-id'), 1));
            document.querySelectorAll('.input-notes').forEach(i => i.onchange = (e) => {
                const idx = cart.findIndex(c => c.cartId === e.currentTarget.getAttribute('data-id'));
                if (idx !== -1) { cart[idx].notes = e.currentTarget.value; saveCart(); }
            });
        }

        function updateQty(cartId, delta) {
            const idx = cart.findIndex(c => c.cartId === cartId);
            if (idx !== -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) cart.splice(idx, 1);
            }
            saveCart();
            updateCartUI();
        }

        function submitOrder() {
            if (cart.length === 0) { showToast("Keranjang belanja kamu kosong!", "error"); return; }
            const jam = document.getElementById('checkout-jam').value;
            const bayar = document.getElementById('checkout-bayar').value;
            const totalPrice = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const newOrder = {
                id: orderId,
                waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                tanggal: new Date().toLocaleDateString('id-ID'),
                siswa: currentUser.nama,
                kelas: currentUser.kelas,
                jamPengambilan: jam,
                pembayaran: bayar,
                items: [...cart],
                total: totalPrice,
                status: 'Menunggu'
            };

            orders.unshift(newOrder);
            localStorage.setItem('kantin_orders', JSON.stringify(orders));

            // SIMPAN OTOMATIS KE FIREBASE REALTIME CLOUD
            if (db) {
                try { db.ref('orders/' + orderId).set(newOrder); } catch(e) {}
            }

            cart = [];
            saveCart();
            updateCartUI();
            toggleCartDrawer();
            showToast("Pre-order berhasil dikirim! 🚀");
            switchSiswaView('orders');
        }

        function renderMyOrders() {
            const container = document.getElementById('my-orders-list');
            const countBadge = document.getElementById('my-orders-count');
            const myOrders = orders.filter(o => o.siswa === currentUser.nama && o.kelas === currentUser.kelas);

            if (myOrders.length > 0) { countBadge.innerText = myOrders.length; countBadge.classList.remove('hidden'); }
            else countBadge.classList.add('hidden');

            if (myOrders.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl border-2 border-pink-100 p-8 text-center text-slate-400"><p class="text-xs font-bold font-cute">Belum Ada Pesanan Aktif 📋</p></div>`;
                return;
            }

            container.innerHTML = '';
            myOrders.forEach(ord => {
                let statusColor = 'bg-amber-100 text-amber-800';
                if (ord.status === 'Diproses') statusColor = 'bg-blue-100 text-blue-800';
                if (ord.status === 'Siap Diambil') statusColor = 'bg-emerald-100 text-emerald-800';
                if (ord.status === 'Selesai') statusColor = 'bg-slate-100 text-slate-600';

                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl border-2 border-pink-100 p-4 space-y-3 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-pink-50 pb-2">
                        <div><span class="font-bold text-xs text-slate-800 font-cute">${ord.id}</span><span class="text-[11px] text-slate-400 ml-2 font-medium">${ord.waktu} WIB</span></div>
                        <span class="text-[10px] px-3 py-1 rounded-full font-bold ${statusColor}">${ord.status}</span>
                    </div>
                    <div class="space-y-1.5">
                        ${ord.items.map(i => `<div class="text-xs flex justify-between"><span class="text-slate-700 font-semibold">${i.qty}x ${i.nama}</span><span class="text-slate-500 font-bold">Rp ${(i.harga * i.qty).toLocaleString('id-ID')}</span></div>${i.notes ? `<p class="text-[11px] text-amber-800 bg-amber-50 px-2.5 py-1 rounded-xl italic">Catatan: "${i.notes}"</p>` : ''}`).join('')}
                    </div>
                    <div class="border-t border-pink-50 pt-2 flex justify-between items-center text-xs">
                        <span class="text-slate-500">Ambil: <b>${ord.jamPengambilan}</b></span>
                        <span class="font-bold text-pink-500 text-sm font-cute">Rp ${ord.total.toLocaleString('id-ID')}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderPenjualOrders() {
            const listContainer = document.getElementById('penjual-orders-list');
            document.getElementById('stat-total').innerText = orders.length;
            document.getElementById('stat-pending').innerText = orders.filter(o => o.status === 'Menunggu' || o.status === 'Diproses').length;
            const income = orders.reduce((sum, o) => sum + o.total, 0);
            document.getElementById('stat-income').innerText = `Rp ${income.toLocaleString('id-ID')}`;

            if (orders.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs font-bold">Belum ada pesanan masuk dari siswa</div>`;
                return;
            }

            listContainer.innerHTML = '';
            orders.forEach(ord => {
                const card = document.createElement('div');
                card.className = "p-4 hover:bg-pink-50/30 transition space-y-3";
                card.innerHTML = `
                    <div class="flex flex-wrap justify-between items-start gap-2">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-slate-800 text-sm font-cute">${ord.siswa}</span>
                                <span class="bg-purple-100 text-purple-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full font-cute">${ord.kelas}</span>
                            </div>
                            <p class="text-xs text-slate-400 mt-0.5">${ord.id} • ${ord.waktu} WIB • <span class="font-bold text-slate-600">${ord.jamPengambilan}</span></p>
                        </div>
                        <select data-id="${ord.id}" class="select-order-status text-xs font-bold p-2 rounded-2xl border-2 border-pink-100 bg-white outline-none font-cute">
                            <option value="Menunggu" ${ord.status === 'Menunggu' ? 'selected' : ''}>Menunggu</option>
                            <option value="Diproses" ${ord.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
                            <option value="Siap Diambil" ${ord.status === 'Siap Diambil' ? 'selected' : ''}>Siap Diambil</option>
                            <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                        </select>
                    </div>
                    <div class="bg-pink-50/50 p-3 rounded-2xl space-y-2 border border-pink-100">
                        ${ord.items.map(i => `<div class="text-xs border-b border-pink-100 pb-1.5 last:border-0 last:pb-0"><div class="flex justify-between font-bold text-slate-700"><span>${i.qty}x ${i.nama}</span><span>Rp ${(i.harga * i.qty).toLocaleString('id-ID')}</span></div>${i.notes ? `<p class="text-[11px] text-amber-800 font-semibold mt-0.5">Catatan: "${i.notes}"</p>` : ''}</div>`).join('')}
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">Pembayaran: <b>${ord.pembayaran}</b></span>
                        <span class="font-bold text-pink-500 text-sm font-cute">Total: Rp ${ord.total.toLocaleString('id-ID')}</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            document.querySelectorAll('.select-order-status').forEach(s => {
                s.onchange = (e) => updateOrderStatus(e.currentTarget.getAttribute('data-id'), e.currentTarget.value);
            });
        }

        function updateOrderStatus(orderId, newStatus) {
            const idx = orders.findIndex(o => o.id === orderId);
            if (idx !== -1) {
                orders[idx].status = newStatus;
                localStorage.setItem('kantin_orders', JSON.stringify(orders));
                renderPenjualOrders();

                if (db) {
                    try { db.ref('orders/' + orderId + '/status').set(newStatus); } catch(e) {}
                }
                showToast(`Status pesanan ${orderId} diubah ke ${newStatus}`);
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = type === 'error' 
                ? "fixed top-5 right-5 z-50 bg-red-500 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transition-all duration-300"
                : "fixed top-5 right-5 z-50 bg-white/95 backdrop-blur-md border-2 border-pink-300 text-slate-800 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transition-all duration-300";
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
